<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C185" />
      <stop offset="50%" stop-color="#C5A872" />
      <stop offset="100%" stop-color="#967E51" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A872" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0B0C" stop-opacity="1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C5A872" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="#0B0B0C" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Architecture Hexagon Node -->
  <polygon points="256,60 410,148 410,324 256,412 102,324 102,148" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4" />

  <!-- Monogram DA Text -->
  <g font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" filter="url(#shadow)">
    <text x="256" y="315" font-size="210" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="-8">DA</text>
  </g>

  <!-- Glowing System Node Dot -->
  <circle cx="390" cy="130" r="20" fill="#E5C185" />
  <circle cx="390" cy="130" r="30" fill="none" stroke="#E5C185" stroke-width="4" opacity="0.6" />
</svg>
